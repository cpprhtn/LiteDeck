name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go (${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests need nothing; integration tests need Docker, which the
          # Ubuntu runner has. Splitting them means a Docker outage does not
          # hide a genuine unit-test regression.
          - kind: unit
            args: -short
          - kind: integration
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this, setup-go keeps whatever Go the runner image
          # already has as long as it satisfies GO_VERSION — which is how
          # govulncheck failed on stdlib fixes that had already shipped in
          # a newer patch. It also decides which toolchain builds the
          # released binaries, so the ones people download carry the fixes.
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt에 어긋나는 파일이 있습니다:"
            echo "$unformatted"
            exit 1
          fi

      # The race detector is not optional here: the prompt bridge, the transfer
      # queue and the terminal registry are the parts most likely to break, and
      # they only break under concurrency.
      - name: go test
        run: go test ./... -race -count=1 -timeout 30m ${{ matrix.args }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this, setup-go keeps whatever Go the runner image
          # already has as long as it satisfies GO_VERSION — which is how
          # govulncheck failed on stdlib fixes that had already shipped in
          # a newer patch. It also decides which toolchain builds the
          # released binaries, so the ones people download carry the fixes.
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # tsc runs as part of the build script, so a type error fails here.
      - run: npm run build
        working-directory: frontend

  build:
    name: Build (${{ matrix.os }})
    needs: [go, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this, setup-go keeps whatever Go the runner image
          # already has as long as it satisfies GO_VERSION — which is how
          # govulncheck failed on stdlib fixes that had already shipped in
          # a newer patch. It also decides which toolchain builds the
          # released binaries, so the ones people download carry the fixes.
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails needs the system webview's development headers on Linux. Ubuntu
      # 22.04 ships webkit2gtk-4.0 and newer releases only have 4.1, so the
      # package name has to be resolved rather than hard-coded — this is the
      # fragmentation noted as an open risk.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config
          if apt-cache show libwebkit2gtk-4.0-dev >/dev/null 2>&1; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev
          else
            sudo apt-get install -y libwebkit2gtk-4.1-dev
            echo "WAILS_TAGS=webkit2_41" >> "$GITHUB_ENV"
          fi

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        shell: bash
        run: |
          if [ -n "${WAILS_TAGS:-}" ]; then
            wails build -tags "$WAILS_TAGS"
          else
            wails build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: litedeck-${{ matrix.os }}
          path: build/bin/
          retention-days: 7
