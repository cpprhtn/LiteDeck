name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — no release is published)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.13.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            # A universal binary rather than two downloads: the split between
            # Intel and Apple Silicon is invisible to most users, and picking
            # the wrong one produces an app that simply refuses to open.
            wails_args: -platform darwin/universal
            artifact: litedeck-macos
          - os: windows-latest
            name: Windows (amd64)
            # Portable exe, no installer. -nsis was here and did nothing: the
            # runner has no NSIS, and wails only warns and carries on, so the
            # build "succeeded" while quietly dropping the installer — v0.1.0-beta
            # shipped promising a file that was never built. LiteDeck is a single
            # self-contained binary, so an installer buys a Start Menu entry and
            # an uninstaller and little else. Dropping the flag makes the
            # workflow say what it actually does.
            wails_args: -platform windows/amd64
            artifact: litedeck-windows
          - os: ubuntu-latest
            name: Linux (amd64)
            wails_args: -platform linux/amd64
            artifact: litedeck-linux

    steps:
      - uses: actions/checkout@v4

      # The tag says which release this is; app.Version is what the binary tells
      # the user it is. Nothing connected the two, so tagging without bumping
      # would publish a build that reports the previous version — and that
      # number is the one that reaches the bug report, which is the whole reason
      # the constant exists.
      #
      # version_test.go already ties app.Version to wails.json's productVersion.
      # This is the third corner: the tag actually being built. Checked here
      # rather than in the release job so it fails before three platforms spend
      # several minutes each.
      #
      # A pre-release tag carries its suffix here too — v1.6.0-rc.1 means
      # Version = "1.6.0-rc.1". The binary should say what the tag says.
      - name: Tag matches the version in the source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -eu
          source_version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/app/version.go)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ -z "$source_version" ]; then
            echo "::error::could not read Version out of internal/app/version.go — has the declaration changed shape?"
            exit 1
          fi
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app.Version (${source_version}). Bump internal/app/version.go and wails.json together, or retag."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches app.Version ${source_version}"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Without this, setup-go keeps whatever Go the runner image
          # already has as long as it satisfies GO_VERSION — which is how
          # govulncheck failed on stdlib fixes that had already shipped in
          # a newer patch. It also decides which toolchain builds the
          # released binaries, so the ones people download carry the fixes.
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config
          if apt-cache show libwebkit2gtk-4.0-dev >/dev/null 2>&1; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev
          else
            sudo apt-get install -y libwebkit2gtk-4.1-dev
            echo "EXTRA_TAGS=-tags webkit2_41" >> "$GITHUB_ENV"
          fi

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        shell: bash
        run: wails build ${{ matrix.wails_args }} ${EXTRA_TAGS:-} -clean

      # Packaging, per platform. The .app bundle has to be archived rather than
      # uploaded directly — GitHub artifacts flatten directories and would
      # destroy the bundle's executable bit.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          # The bundle name comes from wails.json's outputfilename (litedeck.app),
          # not from info.productName, so it is globbed rather than spelled out.
          #
          # Spelling it wrong is not a build failure on a case-insensitive APFS
          # runner: zip matches anyway and silently stores the name as typed,
          # producing an archive that extracts under a different name than a
          # local build. On a case-sensitive volume it fails outright, the
          # following rm becomes a no-op, and the raw .app directory is uploaded
          # as an artifact — where the directory is flattened and the executable
          # bit is lost. Both failures ship; neither announces itself.
          shopt -s nullglob
          apps=(*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected exactly one .app bundle in build/bin, found ${#apps[@]}: ${apps[*]:-none}"
            ls -la
            exit 1
          fi
          zip -ry litedeck-desktop-macos.zip "${apps[0]}"
          rm -rf "${apps[0]}"

      # Windows is the only platform that was uploading a bare executable, and a
      # freshly built unsigned .exe with no reputation is exactly what Defender
      # deletes the moment it lands in Downloads — before the user can even see
      # a SmartScreen prompt. That happened on the first release someone tried.
      #
      # A zip does not make the binary trusted; it stops the *download* from
      # being a bare PE, which is what triggers the automatic removal. Defender
      # can still object when the extracted file runs, and the release notes say
      # so rather than pretending this solves it.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/bin
          if [ ! -f litedeck.exe ]; then
            echo "::error::litedeck.exe not found in build/bin"
            ls -la
            exit 1
          fi
          7z a -tzip litedeck-desktop-windows-amd64.zip litedeck.exe
          rm -f litedeck.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          tar czf litedeck-desktop-linux-amd64.tar.gz litedeck
          rm -f litedeck

      - name: Checksums
        shell: bash
        run: |
          cd build/bin
          # Published alongside the binaries because releases are unsigned for
          # now (notarisation and Authenticode both cost money). A checksum is
          # not a substitute for a signature, and the README says so.
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/
          retention-days: 14

  server:
    name: Server (headless, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The same reason as the desktop build: the newest patch carries the
          # stdlib CVE fixes, and it is what builds the binaries people download.
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The server binary embeds the built frontend (frontend/embed.go), so the
      # UI must be compiled before the Go build — no Wails, no webview, no cgo.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # One static binary per server architecture. CGO_ENABLED=0 means no libc,
      # no webkit — it runs on any Linux box, unlike the desktop Linux binary
      # that is pinned to a webkit2gtk version.
      - name: Build server binaries
        run: |
          mkdir -p build/server
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o litedeck-server-linux-$arch ./cmd/litedeck-server
            tar czf build/server/litedeck-server-linux-$arch.tar.gz litedeck-server-linux-$arch
            rm -f litedeck-server-linux-$arch
          done

      - name: Checksums
        run: |
          cd build/server
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: litedeck-server
          path: build/server/
          retention-days: 14

  release:
    name: Draft release
    needs: [build, server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the tag below. A shallow checkout sees one
          # commit and no tags, so the compare link would have nothing to
          # point back at.
          fetch-depth: 0

      # The previous release, for the "전체 변경 내역" link at the foot of the
      # notes. Sorted by version rather than by date: a patch cut after a
      # later minor would otherwise become everyone's idea of "previous".
      - name: Previous tag
        id: prev
        run: |
          prev=$(git tag --list 'v*' --sort=-version:refname \
            | grep -vx "$GITHUB_REF_NAME" | head -1)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "previous release: ${prev:-(none)}"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect and re-checksum
        run: |
          mkdir -p release
          find dist -type f ! -name 'SHA256SUMS.txt' -exec cp {} release/ \;
          cd release
          # One combined manifest: the per-platform files were generated on
          # different runners and cannot be verified against each other.
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Published rather than drafted. The three platform builds and the whole
          # test suite have already passed by the time this step runs, so a draft
          # only means the release sits invisible until someone remembers to press
          # a button — and a release nobody can download is not a release.
          draft: false
          # Pre-release exactly when the tag says so. Semver puts that in the
          # suffix — v1.2.3-beta, -rc.1 — and a bare v1.2.3 is a real release.
          #
          # This was hard-coded true while every tag was a beta, so v1.0.0 came
          # out wearing a "Pre-release" badge and GitHub refused to call it
          # Latest. A constant that happens to be right for a while is a constant
          # that will be wrong the first time it matters.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The notes are written here rather than generated, and they are
          # almost all installation instructions. Every build is unsigned, so
          # the first thing anyone downloading meets is a Gatekeeper or
          # SmartScreen warning — telling them what it is and how to get past it
          # safely is the release note's actual job. What changed is one link at
          # the bottom, because somebody who cares reads the commits.
          #
          # generate_release_notes is off: it appends an English "What's Changed"
          # block under a Korean page, and the contributor list it builds is this
          # one repository's author every time.
          generate_release_notes: false
          files: release/*
          body: |
            ## 설치 전 확인

            이 릴리스의 실행 파일은 코드 서명 및 공증이 적용되지 않았습니다. 따라서 macOS에서는 Gatekeeper 경고가, Windows에서는 Microsoft Defender SmartScreen 경고가 표시될 수 있습니다.

            다운로드한 파일은 릴리스 자산에 포함된 `SHA256SUMS.txt`를 사용하여 무결성을 확인할 수 있습니다.

            Linux:

            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            macOS:

            ```bash
            shasum -a 256 -c SHA256SUMS.txt
            ```

            SHA-256 체크섬은 다운로드 과정에서 파일이 손상되거나 변경되지 않았는지 확인하기 위한 값입니다. 개발자 신원을 확인하는 코드 서명을 대신하지는 않습니다.

            ## macOS

            `litedeck-desktop-macos.zip`의 압축을 해제한 후 `litedeck.app`을 실행합니다. Intel 및 Apple Silicon을 모두 지원하는 Universal Binary입니다.

            첫 실행 시 개발자를 확인할 수 없다는 경고가 표시될 수 있습니다.

            1. `litedeck.app`을 한 번 실행합니다.
            2. **시스템 설정 → 개인정보 보호 및 보안**으로 이동합니다.
            3. 보안 항목에서 LiteDeck에 대한 **그래도 열기**를 선택합니다.
            4. 확인 창에서 다시 **열기**를 선택합니다.

            `그래도 열기` 버튼은 앱 실행을 시도한 후 일정 시간 동안만 표시될 수 있습니다.

            위 방법으로 실행할 수 없는 경우, 파일의 SHA-256 값을 먼저 확인한 후 다음 명령으로 격리 속성을 제거할 수 있습니다.

            ```bash
            xattr -d com.apple.quarantine litedeck.app
            ```

            이 명령은 macOS의 다운로드 파일 보호 속성을 제거하므로, 공식 릴리스에서 받은 파일인지 반드시 확인한 후 사용하세요.

            ## Windows

            `litedeck-desktop-windows-amd64.zip`의 압축을 해제한 후 `litedeck.exe`를 실행합니다.

            별도의 설치 프로그램은 제공하지 않습니다. 원하는 폴더에 압축을 풀어 사용하고, 제거할 때는 해당 파일과 폴더를 삭제하면 됩니다.

            Microsoft Edge WebView2 Runtime이 설치되어 있지 않은 경우 설치 안내가 표시될 수 있습니다.

            서명되지 않은 신규 실행 파일은 평판 정보가 충분하지 않아 Microsoft Defender SmartScreen 경고가 표시될 수 있습니다. 공식 GitHub 릴리스에서 다운로드했는지와 SHA-256 값이 일치하는지 확인한 후 다음과 같이 실행할 수 있습니다.

            1. SmartScreen 경고 화면에서 **추가 정보**를 선택합니다.
            2. 게시자와 파일 이름을 확인합니다.
            3. 계속하려면 **실행**을 선택합니다.

            Microsoft Defender가 파일을 격리한 경우에는 **Windows 보안 → 바이러스 및 위협 방지 → 보호 기록**에서 탐지 내용을 확인하세요. 오탐이라고 판단되는 경우에만 해당 항목의 허용 또는 복원 여부를 결정하시기 바랍니다.

            ## Linux 데스크톱

            Linux 데스크톱 버전을 실행하려면 WebKitGTK와 GTK 3 라이브러리가 필요합니다. 배포판에 따라 패키지 이름이 다를 수 있습니다.

            ```bash
            tar xzf litedeck-desktop-linux-amd64.tar.gz
            chmod +x litedeck
            ./litedeck
            ```

            ## 서버 모드

            서버 모드는 데스크톱 앱과 별도로 제공되는 바이너리입니다. GUI 관련 WebKitGTK 및 GTK 의존성 없이 서버에서 실행하고, 웹 브라우저를 통해 접속할 수 있습니다.

            데스크톱용 `litedeck-desktop-linux-amd64.tar.gz`와 혼동하지 않도록 주의하세요.

            제공 파일:

            * `litedeck-server-linux-amd64.tar.gz`
            * `litedeck-server-linux-arm64.tar.gz`

            AMD64 환경에서 실행하는 예시는 다음과 같습니다.

            ```bash
            tar xzf litedeck-server-linux-amd64.tar.gz
            chmod +x litedeck-server
            ./litedeck-server
            ```

            실행 후 브라우저에서 다음 주소로 접속합니다.

            ```text
            http://127.0.0.1:8765
            ```

            초기 로그인 비밀번호는 `litedeck`입니다. 서버를 외부에 공개하기 전에 반드시 비밀번호를 변경하세요.

            외부 접속, 리버스 프록시 구성 및 비밀번호 변경 방법은 [서버 모드 안내](https://github.com/cpprhtn/LiteDeck/blob/main/docs/server-mode.md) 를 참고하세요.

            **전체 변경 내역:** [${{ steps.prev.outputs.tag }}...${{ github.ref_name }}](https://github.com/cpprhtn/LiteDeck/compare/${{ steps.prev.outputs.tag }}...${{ github.ref_name }})
